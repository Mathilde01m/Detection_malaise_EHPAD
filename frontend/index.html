<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance Pro | EHPAD Connect</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="login-screen" class="login-page">
        <div class="login-box">
            <div class="logo-shield">✚</div>
            <h1>EHPAD<span>Connect</span></h1>
            <p class="login-subtitle">Interface de Vigilance Médicale</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label>IDENTIFICATION SOIGNANT</label>
                    <input type="password" id="password-input" placeholder="Saisissez votre code d'accès" required>
                </div>
                <button type="submit" class="btn-primary">
                    DÉVERROUILLER L'UNITÉ
                </button>
            </form>
            <p class="login-footer-text">Accès sécurisé crypté AES-256</p>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <header class="main-header">
            <div class="header-left">
                <span class="app-icon">✚</span>
                <div class="app-info">
                    <span class="app-name">VIGILANCE PRO</span>
                    <span class="app-unit">UNITÉ ALPHA</span>
                </div>
            </div>
            <div class="header-right">
                <div class="ai-status">
                    <span class="dot pulse"></span> IA ACTIVE
                </div>
                <div class="user-chip">ID: #8842</div>
            </div>
        </header>

        <nav class="nav-bar">
            <div class="nav-tabs">
                <button class="tab active" data-sector="A">SECTEUR NORD</button>
                <button class="tab" data-sector="B">SECTEUR SUD</button>
                <button class="tab plan-tab" data-sector="PLAN">📍 CARTE THERMIQUE</button>
            </div>
        </nav>

        <main id="main-content">
            <div id="patient-container" class="patient-grid"></div>

            <div id="plan-container" class="hidden">
                <div class="plan-card">
                    <div class="plan-header">
                        <h3>Cartographie des Risques</h3>
                        <p>Analyse prédictive de la charge de soins</p>
                    </div>
                    <div class="map-layout">
                        <div id="map-sector-A" class="map-zone" onclick="selectSector('A')">
                            <span class="zone-label">AILE NORD</span>
                            <strong class="zone-risk">--%</strong>
                        </div>
                        <div id="map-sector-B" class="map-zone" onclick="selectSector('B')">
                            <span class="zone-label">AILE SUD</span>
                            <strong class="zone-risk">--%</strong>
                        </div>
                        <div class="map-station">POSTE DE SOINS CENTRAL</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="side-drawer" class="drawer hidden">
        <div class="drawer-header">
            <button class="close-btn" onclick="closeDrawer()">✕</button>
            <h2 id="drawer-name">Dossier Patient</h2>
        </div>
        
        <nav class="drawer-nav">
            <button class="d-tab active" id="btn-tab-vitals" onclick="switchDrawerTab('vitals')">CONSTANTES</button>
            <button class="d-tab" id="btn-tab-soins" onclick="switchDrawerTab('soins')">VALIDATION</button>
        </nav>

        <div class="drawer-body">
            <div id="tab-vitals" class="tab-content">
                <div class="vitals-dashboard" id="drawer-vitals">
                    </div>
            </div>

            <div id="tab-soins" class="tab-content hidden">
                <div class="validation-card">
                    <div class="security-banner" id="care-banner">
                        ⚠️ INTERVENTION NON VALIDÉE
                    </div>
                    
                    <div class="input-group">
                        <label>RAPPORT CLINIQUE OBLIGATOIRE</label>
                        <textarea id="soignant-note" placeholder="Décrivez l'intervention (état clinique, soins réalisés)..."></textarea>
                    </div>
                    
                    <button class="btn-validate" onclick="validateCare()">
                        <span>✓</span> CONFIRMER LA PRISE EN CHARGE
                    </button>
                </div>
                
                <div id="notes-history" class="history-section">
                    </div>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay hidden" onclick="closeDrawer()"></div>

    <script src="script.js"></script>
</body>
</html>
